log-level="debug"
[[- if .Database]]

[database]
scheme = "postgresql"
user = "rcv"
host = "localhost"
port = 5432
name = "cpro_development"
sslmode = "disable"
password = "rcv"
[[- end]]

[gateway]
# ponytail: placeholder endpoint; point it at the real provider.
url = "http://localhost:9999/"
token = "fake-token"
[[- if .Grpc]]

[server]
# Each module listens on its own port when run standalone: core is 8090,
# auth 8091. Change this value if it clashes with another module.
port = 8092
scheme = "http"
host = "localhost"
allowed-origins = ["http://localhost:8090", "http://localhost:4200", "http://localhost:4201"] # Explicit origins only (credentials are allowed): the apps allowed to call this API. Set the real ones in production.
debug-enabled = true

[auth-server]
port = 8091
scheme = "http"
host = "localhost"
[[- end]]
