# mmw new module — manifest for goplt.
# Delimiters are [[ ]] so the bungen templates and mise.toml, which contain
# {{…}}, reach the generated module untouched.
description = "A cpro2 hexagonal module with one slice"
delimiters = ["[[", "]]"]

[variables.name]
kind = "input"
required = true
description = "Module name, one lower-case word: directory, Go package, Postgres schema, proto package (e.g. facturation)"

[variables.entity]
kind = "input"
required = true
description = "Name of the first domain, singular, one lower-case word (e.g. facture)"

[variables.database]
kind = "bool"
value = true
description = "Persist <entity> in Postgres: schema, migrations, outbox (no: gateway slice calling an external service)"

[variables.create-table]
kind = "bool"
value = true
description = "Create the <name>.<entity> table and seed it with sample rows (ignored without database)"

[variables.grpc]
kind = "bool"
value = true
description = "Expose the service over Connect/gRPC (no: in-proc only, like notifications)"

# Every matching prefix must hold: the create-table files need both their
# own condition and the persistence prefix.
[conditions]
"modules/[[.Name]]/internal/infra/persistence/migrations/scripts/20261013120100_create-[[.Entity]].sql" = "[[if .CreateTable]]true[[end]]"
"modules/[[.Name]]/internal/infra/persistence/migrations/scripts/20261013120200_seed-[[.Entity]].sql" = "[[if .CreateTable]]true[[end]]"
"modules/[[.Name]]/internal/infra/persistence/" = "[[if .Database]]true[[end]]"
"modules/[[.Name]]/internal/adapters/outbound/persistence/" = "[[if .Database]]true[[end]]"
"modules/[[.Name]]/internal/adapters/outbound/events/outbox_dispatcher.go" = "[[if .Database]]true[[end]]"
"modules/[[.Name]]/internal/adapters/inbound/mapper/[[.Entity]].go" = "[[if .Database]]true[[end]]"
"modules/[[.Name]]/internal/adapters/inbound/mapper/[[.Entity]]_test.go" = "[[if .Database]]true[[end]]"
"modules/[[.Name]]/internal/application/ports/uow.go" = "[[if .Database]]true[[end]]"
"modules/[[.Name]]/internal/application/ports/events.go" = "[[if .Database]]true[[end]]"
"modules/[[.Name]]/internal/application/ports/[[.Entity]]_repository.go" = "[[if .Database]]true[[end]]"
"modules/[[.Name]]/internal/application/query/" = "[[if .Database]]true[[end]]"
"modules/[[.Name]]/internal/application/command/[[.Entity]]_delete.go" = "[[if .Database]]true[[end]]"
"modules/[[.Name]]/internal/application/command/[[.Entity]]_delete_test.go" = "[[if .Database]]true[[end]]"
"modules/[[.Name]]/internal/domain/[[.Entity]]/snapshot.go" = "[[if .Database]]true[[end]]"
"modules/[[.Name]]/cmd/migration/" = "[[if .Database]]true[[end]]"
"modules/[[.Name]]/sqlc.yaml" = "[[if .Database]]true[[end]]"
"modules/[[.Name]]/internal/application/ports/[[.Entity]]_gateway.go" = "[[if not .Database]]true[[end]]"
"modules/[[.Name]]/internal/application/ports/publisher.go" = "[[if not .Database]]true[[end]]"
"modules/[[.Name]]/internal/application/command/[[.Entity]]_send.go" = "[[if not .Database]]true[[end]]"
"modules/[[.Name]]/internal/application/command/[[.Entity]]_send_test.go" = "[[if not .Database]]true[[end]]"
"modules/[[.Name]]/internal/adapters/outbound/gateway/" = "[[if not .Database]]true[[end]]"
"modules/[[.Name]]/internal/adapters/outbound/events/bus_publisher.go" = "[[if not .Database]]true[[end]]"
"modules/[[.Name]]/internal/adapters/outbound/events/bus_publisher_test.go" = "[[if not .Database]]true[[end]]"
"modules/[[.Name]]/internal/adapters/inbound/connect/" = "[[if .Grpc]]true[[end]]"
"modules/[[.Name]]/cmd/[[.Name]]/" = "[[if .Grpc]]true[[end]]"
"modules/[[.Name]]/.air.toml" = "[[if .Grpc]]true[[end]]"
